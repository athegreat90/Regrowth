name: Validate Minecraft targets
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: mc2612
            minecraft: '26.1.2'
          - module: mc262
            minecraft: '26.2'
          - module: mc263
            minecraft: '26.3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Clean build and Kotlin compatibility tests
        run: bash gradlew :common:clean :${{ matrix.module }}:clean :common:test :${{ matrix.module }}:build
      - name: Validate prerelease idempotency without network writes
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Assert tests ran and inspect the built JAR
        run: |
          python3 scripts/assert_test_results.py common ${{ matrix.module }}
          python3 scripts/validate_artifact.py ${{ matrix.module }}
      - name: Dedicated GameTest server and gameplay smoke checks
        run: |
          python3 scripts/run_gametests.py ${{ matrix.module }}
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.minecraft }}-${{ github.sha }}
          path: |
            common/build/test-results/
            ${{ matrix.module }}/build/test-results/
            ${{ matrix.module }}/run/logs/
            ${{ matrix.module }}/run/*.xml
      - name: Retain validated version artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regrowth-${{ matrix.minecraft }}-${{ github.sha }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error
