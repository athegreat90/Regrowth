name: Development prerelease for every main commit
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: development-release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: regrowth-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true
      - name: Publish exactly one immutable development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_prerelease.py
