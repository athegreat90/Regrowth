name: Development prerelease for every main commit
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: development-release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: regrowth-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true
      - name: Publish exactly one immutable development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_prerelease.py
